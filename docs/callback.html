<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Epic MCP sign-in</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --accent: #0969da; --box: #f6f8fa; --border: #d1d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --accent: #4493f8; --box: #151b23; --border: #3d444d; }
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 32px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  .box { background: var(--box); border: 1px solid var(--border); border-radius: 8px; padding: 12px; word-break: break-all; font: 13px/1.4 ui-monospace, monospace; max-height: 120px; overflow: auto; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; margin: 12px 0; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--accent); color: #fff; font-size: 1rem; text-align: center; text-decoration: none; cursor: pointer; }
  a.btn.secondary { background: transparent; color: var(--accent); }
  .err { color: #cf222e; }
</style>
</head>
<body>
<main>
  <h1>Epic MCP sign-in</h1>
  <p id="status">Finishing sign-in…</p>
  <div id="actions" hidden>
    <a class="btn" id="continue" href="#">Continue on this computer</a>
    <button id="copy" type="button">Copy sign-in link for Claude</button>
    <div class="box" id="url"></div>
    <p>On a phone or another device, use <strong>Copy</strong> and paste the link into your Claude conversation. The link works once and expires in a few minutes.</p>
  </div>
</main>
<script>
// This page only relays MyChart's one-time sign-in code to Epic MCP running on your own computer
// (https://localhost:8765). It sends nothing anywhere else and loads no other resources.
(function () {
  var q = window.location.search;
  var params = new URLSearchParams(q);
  var status = document.getElementById("status");
  if (params.get("error")) {
    status.className = "err";
    status.textContent = "MyChart returned an error: " + params.get("error") + " " + (params.get("error_description") || "");
    return;
  }
  if (!params.get("code")) {
    status.textContent = "This page completes Epic MCP sign-ins. There is no sign-in in progress.";
    return;
  }
  var port = /^\d{2,5}$/.test(params.get("port") || "") ? params.get("port") : "8765";
  var local = "https://localhost:" + port + "/callback" + q;
  document.getElementById("continue").href = local;
  document.getElementById("url").textContent = local;
  document.getElementById("actions").hidden = false;
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(local).then(function () {
      document.getElementById("copy").textContent = "Copied. Paste it into Claude";
    });
  };
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (mobile) {
    status.textContent = "Signed in to MyChart. Copy the link below and paste it into Claude.";
  } else {
    status.textContent = "Signed in to MyChart. Sending you back to Epic MCP on this computer…";
    setTimeout(function () { window.location.replace(local); }, 800);
  }
})();
</script>
</body>
</html>
